<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Plan de Clases — Método Antigravity</title>
<style>
  @font-face{
    font-family:'Space Grotesk';
    src:url('assets/fonts/SpaceGrotesk-VariableFont_wght.ttf') format('truetype');
    font-weight:100 900;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --color-dark: #2E2E2E;
    --color-darker: #1A1A1A;
    --color-cream: #EAE5DC;
    --color-orange: #C97C2A;
    --color-teal: #2EAD82;
    --color-blue: #3A8FB5;
    --color-white: #FFFFFF;

    --bg: var(--color-darker);
    --bg-elev: var(--color-dark);
    --bg-elev2: #3A3A3A;
    --ink: var(--color-white);
    --ink-dim: rgba(255,255,255,0.56);
    --line: rgba(255,255,255,0.14);
    --ember: var(--color-orange);
    --lake: var(--color-blue);
    --moss: var(--color-teal);
    --wine: var(--color-cream);
    --accent: var(--color-orange);
    --radius: 10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    position:relative;
    background: var(--bg);
    color:var(--ink);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url('assets/texturas/textura-02.png');
    background-size:300%;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0.10;
    pointer-events:none;
    z-index:0;
  }
  .wrap{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:18px 16px 60px; }
  .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

  header.top{
    display:flex; flex-direction:column; gap:10px;
    padding-bottom:14px; margin-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand-logo-row{ display:flex; align-items:flex-end; gap:8px; margin-bottom:2px; }
  header.top .brand-logo-row img{ display:block; width:auto; object-fit:contain; }
  header.top .brand-logo-row .iso{ height:23px; }
  header.top .brand-logo-row .word{ height:18px; }
  header.top .eyebrow{
    letter-spacing:.16em; text-transform:uppercase; font-size:11px; font-weight:600; color:var(--accent);
  }
  header.top h1{ margin:2px 0 0; font-size:22px; font-weight:700; letter-spacing:-.01em; }
  header.top .sub{ color:var(--ink-dim); font-size:13px; margin-top:2px; }

  nav.tabs{ display:flex; gap:8px; margin-bottom:16px; }
  nav.tabs button{
    flex:1; padding:9px 10px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg-elev); color:var(--ink-dim); font-size:13px; font-weight:600;
    cursor:pointer; transition:.15s;
  }
  nav.tabs button.active{ background:var(--accent); color:#20242B; border-color:var(--accent); }

  /* --- Modo edición --- */
  .editbar{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .edit-toggle{
    font-size:12px; font-weight:700; padding:7px 12px; border-radius:999px;
    background:var(--bg-elev); border:1px solid var(--line); color:var(--ink); cursor:pointer;
  }
  .edit-toggle.on{ background:var(--color-teal); border-color:var(--color-teal); color:#08201A; }
  .edit-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .edit-action-btn{
    font-size:12px; font-weight:600; padding:7px 12px; border-radius:999px;
    background:transparent; border:1px solid var(--accent); color:var(--accent); cursor:pointer;
  }
  .edit-action-btn.edit-action-danger{ border-color: rgba(255,255,255,0.3); color:var(--ink-dim); }
  .edit-hint{ font-size:11.5px; color:var(--ink-dim); margin:0 0 14px; }

  .exercise-edit{ padding:12px 13px; border-top:1px solid var(--line); background:rgba(255,255,255,0.03); }
  .exercise-edit:first-of-type{ border-top:none; }
  .ef-row, .ef-row2, .ef-row3{ display:grid; gap:8px; margin-bottom:8px; }
  .ef-row{ grid-template-columns: 1fr; }
  .ef-row2{ grid-template-columns: 1fr 1fr; }
  .ef-row3{ grid-template-columns: repeat(3, 1fr); }
  .ef-label{ display:flex; flex-direction:column; gap:3px; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-dim); font-weight:600; }
  .ef-input{
    font-family:inherit; font-size:13px; color:var(--ink); background:var(--bg); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; width:100%; resize:vertical;
  }
  .ef-input:focus{ outline:none; border-color:var(--accent); }
  .ef-del{
    font-size:11.5px; color:#E07070; background:transparent; border:1px solid rgba(224,112,112,0.4);
    border-radius:6px; padding:5px 9px; cursor:pointer; margin-top:2px;
  }
  .ef-add{
    display:block; width:100%; margin-top:4px; padding:9px; font-size:12.5px; font-weight:600;
    background:transparent; border:1px dashed var(--line); border-radius:6px; color:var(--ink-dim); cursor:pointer;
  }
  .ef-add:hover{ border-color:var(--accent); color:var(--accent); }

  /* --- Date navigator --- */
  .datebar{
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
  }
  .datebar button.step{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg-elev); color:var(--ink); font-size:18px; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .datebar button.step:active{ background:var(--bg-elev2); }
  .datebar input[type=date]{
    flex:1; background:var(--bg-elev); border:1px solid var(--line); color:var(--ink);
    border-radius:var(--radius); padding:9px 10px; font-size:14px; font-family:inherit;
    min-width:0;
  }
  .datebar input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(0.8); }

  /* --- Mesociclo badge --- */
  .meso-badge{
    display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius);
    background:var(--bg-elev); border:1px solid var(--line); margin-bottom:16px;
  }
  .meso-badge .tag{
    font-family: ui-monospace, monospace; font-size:11px; font-weight:700; letter-spacing:.05em;
    background:var(--accent); color:#20242B; padding:3px 7px; border-radius:5px; flex:none;
  }
  .meso-badge .info b{ display:block; font-size:14px; }
  .meso-badge .info span{ display:block; font-size:12px; color:var(--ink-dim); margin-top:2px; }

  /* --- Empty state --- */
  .empty{
    text-align:center; padding:46px 18px; color:var(--ink-dim); border:1px dashed var(--line);
    border-radius:var(--radius); background:var(--bg-elev);
  }
  .empty p{ margin:0 0 14px; font-size:14px; }
  .empty button{
    background:var(--accent); color:#20242B; border:none; padding:10px 16px; border-radius:999px;
    font-weight:700; font-size:13px; cursor:pointer;
  }

  /* --- Session blocks --- */
  .block{
    border-radius:var(--radius); margin-bottom:14px; overflow:hidden; border:1px solid var(--line);
    background:var(--bg-elev);
  }
  .block .bhead{
    padding:9px 13px; font-weight:800; font-size:12.5px; letter-spacing:.03em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px; color:#20242B;
    cursor:pointer; user-select:none;
  }
  .block .bhead .toggle-icon{
    margin-left:auto; font-size:14px; transition:transform .2s; line-height:1;
  }
  .block.collapsed .bhead .toggle-icon{ transform:rotate(-90deg); }
  .block .bcontent{ transition:none; }
  .block.collapsed .bcontent{ display:none; }
  .block.Calentamiento .bhead{ background:var(--color-orange); color:#20140A; }
  .block.Calentamiento-Muro .bhead{ background:rgba(201,124,42,0.55); color:var(--color-white); }
  .block.Principal-Dirigido .bhead{ background:var(--color-blue); color:#0B1B22; }
  .block.Principal-Especial .bhead{ background:var(--color-teal); color:#08201A; }
  .block.Pre-Cierre .bhead{ background:rgba(46,173,130,0.55); color:var(--color-white); }
  .block.Cierre .bhead{ background:var(--color-cream); color:#20140A; }

  .exercise{ padding:12px 13px; border-top:1px solid var(--line); }
  .exercise:first-of-type{ border-top:none; }
  .exercise .ename{ font-weight:700; font-size:14.5px; margin-bottom:6px; }
  .exercise .emeta{ color:var(--ink-dim); font-size:12.5px; margin-bottom:8px; }
  .grid{
    display:grid; grid-template-columns: repeat(2, 1fr); gap:6px 14px; font-size:12.5px; margin-bottom:8px;
  }
  .grid .g-item b{
    display:block; font-family: ui-monospace, monospace; font-size:10.5px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-dim); font-weight:600; margin-bottom:1px;
  }
  .grid .g-item span{ font-family: ui-monospace, monospace; font-size:13px; }
  .exercise .como{ font-size:12.5px; color:var(--ink); margin-bottom:6px; }
  .exercise .como b{ color:var(--ink-dim); font-weight:600; }
  .exercise .justif{ font-size:12px; color:var(--ink-dim); font-style:italic; border-left:2px solid var(--line); padding-left:8px; }

  /* --- Macrociclo (vista calendario) --- */
  .meso-legend{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .meso-legend .chip{
    display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600;
    padding:5px 10px; border-radius:999px; background:var(--bg-elev); border:1px solid var(--line);
  }
  .meso-legend .chip .dot{ width:8px; height:8px; border-radius:50%; flex:none; }

  .week-strip{ display:flex; gap:3px; margin-bottom:22px; }
  .week-strip .seg{
    flex:1; height:9px; border-radius:3px; cursor:pointer; transition:transform .15s;
  }
  .week-strip .seg:hover{ transform:scaleY(1.6); }

  .meso-group{ margin-bottom:24px; }
  .meso-group-head{
    border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;
    background:var(--bg-elev); border:1px solid var(--line); border-left:4px solid var(--accent);
  }
  .meso-group-head .mid{
    font-family: ui-monospace, monospace; font-size:10.5px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; opacity:.8;
  }
  .meso-group-head .mname{ font-size:15px; font-weight:700; margin-top:2px; }
  .meso-group-head .mgoal{ font-size:12.5px; color:var(--ink-dim); margin-top:6px; }
  .meso-group-head .mtrend{ font-size:11.5px; color:var(--ink-dim); margin-top:3px; font-style:italic; }

  .week-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:9px 4px 9px 14px; border-left:2px solid var(--line); margin-left:3px;
  }
  .week-row .wk-num{
    font-family: ui-monospace, monospace; font-size:11px; color:var(--ink-dim); width:64px; flex:none;
  }
  .week-row .wk-dates{ display:flex; gap:6px; flex-wrap:wrap; }
  .week-row .wk-chip{
    font-size:12px; padding:6px 11px; border-radius:8px; background:var(--bg-elev);
    border:1px solid var(--line); cursor:pointer; white-space:nowrap; transition:border-color .15s;
  }
  .week-row .wk-chip:hover{ border-color:var(--accent); }
  .week-row .wk-chip .d{ font-weight:700; }
  .week-row .wk-chip .m{ color:var(--ink-dim); font-size:10.5px; text-transform:uppercase; margin-left:3px; }

  footer{ margin-top:30px; text-align:center; font-size:11px; color:var(--ink-dim); }
  /* --- Warmup section --- */
  .warmup-std{ border-color: var(--ember) !important; }
  .warmup-phase{ padding: 10px 13px; border-top: 1px solid var(--line); }
  .warmup-phase-title{
    font-family: ui-monospace, monospace; font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ember); font-weight: 700; margin-bottom: 8px;
  }
  .warmup-list{ margin: 0; padding-left: 18px; }
  .warmup-list li{ font-size: 13px; padding: 3px 0; color: var(--ink); }
  .warmup-list li b{ color: var(--ink); }
  .warmup-table{ width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  .warmup-table th{
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--ink-dim); font-weight: 600;
    padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left;
  }
  .warmup-table td{ padding: 5px 6px; border-bottom: 1px solid var(--line); }
  .warmup-table tr:last-child td{ border-bottom: none; }
  .warmup-table .pct{ font-family: ui-monospace, monospace; font-weight: 700; color: var(--accent); }
  .warmup-table .pct-max{ font-family: ui-monospace, monospace; font-weight: 700; color: var(--wine); }
  .video-link{
    display: inline-flex; align-items: center; gap: 4px; margin-top: 6px;
    font-size: 12px; color: var(--lake); text-decoration: none; font-weight: 600;
  }
  .video-link:hover{ text-decoration: underline; }
  .video-todo{ color: var(--ink-dim); font-style: italic; }

</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand-logo-row">
      <img class="iso" src="assets/logo/isotipo-piece.png" alt="">
      <img class="word" src="assets/logo/wordmark-blanco.png" alt="La Junta">
    </div>
    <div class="eyebrow">Método Antigravity · Clase grupal</div>
    <h1 id="programTitle">Programa de escalada</h1>
    <div class="sub" id="programSub"></div>
  </header>

  <nav class="tabs">
    <button id="tabSesion" class="active">Sesión de hoy</button>
    <button id="tabMacro">Macrociclo</button>
  </nav>

  <div class="editbar">
    <button id="editToggle" class="edit-toggle">✏️ Editar</button>
    <div class="edit-actions" id="editActions" style="display:none">
      <button id="exportBtn" class="edit-action-btn">⬇ Descargar .html actualizado</button>
      <button id="resetBtn" class="edit-action-btn edit-action-danger">↺ Restablecer</button>
    </div>
  </div>
  <p class="edit-hint" id="editHint" style="display:none">Los cambios se guardan automáticamente en este navegador. Descargá el archivo para guardarlos de forma permanente y reemplazar el original.</p>

  <div id="viewSesion">
    <div class="datebar">
      <button class="step" id="prevBtn" aria-label="Sesión anterior">‹</button>
      <input type="date" id="dateInput">
      <button class="step" id="nextBtn" aria-label="Sesión siguiente">›</button>
    </div>

    <div id="mesoBadge"></div>
    <div id="sessionContent"></div>
  </div>

  <div id="viewMacro" style="display:none">
    <div class="meso-legend" id="mesoLegend"></div>
    <div class="week-strip" id="weekStrip"></div>
    <div id="calendarList"></div>
  </div>

  <footer>Plan generado para uso interno de clase — Antigravity (Sergio Consuegra), adaptado por Paul.</footer>
</div>

<script>
const PRISTINE_HTML = document.documentElement.outerHTML;
const DATA = {"mesociclos":[{"id":"M0","nombre":"Preparatorio General","semanas":3,"objetivo":"Prevenir lesiones y aumentar la capacidad de trabajo general antes de entrar en contenidos específicos.","tendencia":"Intensidad progresiva baja-media, volumen medio. Cargas submáximas de acondicionamiento general.","justificacion":"Es el bloque más corto y sirve de base: casi no hay escalada intensa, se prioriza técnica y fortalecimiento general."},{"id":"M1","nombre":"Fuerza Máxima (agarre y tracción)","semanas":3,"objetivo":"Construir el motor de fuerza base: fuerza máxima de agarre y de tracción.","tendencia":"Intensidad máxima desde el inicio, volumen mínimo que crece ligeramente semana a semana.","justificacion":"En la planificación lineal inversa, la fuerza máxima siempre se entrena primero, antes de la resistencia."},{"id":"M2","nombre":"RFD / Fuerza de Contacto / Potencia","semanas":2,"objetivo":"Desarrollar la velocidad de aplicación de fuerza (RFD) y la potencia.","tendencia":"Intensidad muy alta, volumen bajo, recuperaciones siempre completas.","justificacion":"Se entrena justo después de la fuerza máxima porque comparte la misma vía neural, antes de introducir fatiga metabólica."},{"id":"M3","nombre":"Resistencia Alta Intensidad — Anaeróbica (Desoxigenación)","semanas":3,"objetivo":"Aumentar la tolerancia a la acumulación de fatiga en tramos duros (crux, boulders exigentes).","tendencia":"Intensidad alta, volumen medio que crece semana a semana.","justificacion":"Tras construir fuerza y potencia, se entrena la capacidad de sostenerlas bajo fatiga metabólica."},{"id":"M4","nombre":"Resistencia Alta Intensidad — Reoxigenación","semanas":3,"objetivo":"Aprender a recuperar activamente en pared (gestión de reposos entre esfuerzos).","tendencia":"Intensidad alta con micropausas, volumen creciente.","justificacion":"Complementa la desoxigenación: no solo tolerar el esfuerzo, sino recuperarse eficientemente entre esfuerzos."},{"id":"M5","nombre":"Resistencia Baja Intensidad — Aeróbica","semanas":2,"objetivo":"Construir la base aeróbica del antebrazo y acumular volumen de escalada continua.","tendencia":"Intensidad mínima, volumen máximo de todo el programa.","justificacion":"Cierra el ciclo de trabajo físico específico antes del tapering, siguiendo la secuencia de mayor a menor intensidad."},{"id":"M6","nombre":"Tapering","semanas":2,"objetivo":"Eliminar la fatiga acumulada y llegar frescos al cierre del programa (permitir supercompensación).","tendencia":"Reducción de volumen del 40-60% respecto a la última semana de carga; la intensidad se mantiene constante, sin pruebas nuevas.","justificacion":"Todo macrociclo de la planificación lineal inversa debe terminar en un periodo de afinamiento para consolidar las adaptaciones logradas."}],"sessions":[{"fecha":"2026-07-14","diaSemana":"Martes","mesociclo":"M0","mesocicloNombre":"Preparatorio General","mesocicloObjetivo":"Prevenir lesiones y aumentar la capacidad de trabajo general antes de entrar en contenidos específicos.","ejercicios":[{"bloque":"Calentamiento","ejercicio":"Movilidad articular general (CARS)","objetivo":"Preparar articulaciones sin fatiga","material":"Ninguno","series":"1","reps":"6-8 por articulación","intensidad":"Baja","como":"Movimientos controlados en rango completo, sin dolor","rir":"No aplica","recup":"Continuo","dur":6,"justif":"Activa el sistema nervioso y las articulaciones sin generar fatiga previa a la sesión."},{"bloque":"Calentamiento","ejercicio":"Activación cardiovascular (salto de cuerda)","objetivo":"Elevar frecuencia cardiaca de forma progresiva","material":"Cuerda","series":"3","reps":"40 / 40 / 20 saltos","intensidad":"RPE 3 → 5 → 7 (ascendente)","como":"Ronda 1: 40 saltos ritmo cómodo a dos pies (RPE 3). Ronda 2: 40 saltos alternando pie, ritmo medio (RPE 5). Ronda 3: 20 saltos rápido o dobles si el nivel lo permite (RPE 7).","rir":"No aplica","recup":"15\" entre rondas","dur":5,"justif":"Sube la temperatura corporal y el pulso de forma progresiva en vez de un volumen fijo, preparando mejor la transición a la activación de dedos."},{"bloque":"Principal-Dirigido","ejercicio":"Sentadilla goblet con mancuerna","objetivo":"Fuerza general de piernas y core","material":"Mancuerna","series":["2","3","4"],"reps":"8-12","intensidad":["CE 6(12)","CE 7(12)","CE 8(12)"],"como":"Mancuerna pegada al pecho, bajar controlando la profundidad hasta donde la técnica se mantenga limpia","rir":"RIR 4-6","recup":"1'30\"","dur":10,"justif":"Base de fuerza de piernas para absorber impactos y generar propulsión de pies al escalar."},{"bloque":"Principal-Dirigido","ejercicio":"Zancada búlgara (pie trasero elevado)","objetivo":"Fuerza unilateral de piernas","material":"Banco o superficie elevada, mancuernas","series":["2","3","4"],"reps":"8-10 por pierna","intensidad":["CE 6(10)","CE 7(10)","CE 8(10)"],"como":"Pie trasero apoyado en banco, bajar recto sin que la rodilla delantera se adelante del pie","rir":"RIR 4-6","recup":"1'30\" por lado","dur":10,"justif":"Fuerza unilateral, clave para pasos de una sola pierna y equilibrio en presas de pie pequeñas."},{"bloque":"Principal-Especial","ejercicio":"Drill 'Lazy Climbing' (Matt Chapman)","objetivo":"Corregir hábitos de escalada perezosa desarrollando conciencia postural y eficiencia de movimiento","material":"Pared de boulder","series":"2","reps":"3-4 bloques fáciles","intensidad":"Baja, sin fatiga","como":"Escalar conscientemente evitando posiciones pasivas o de descanso innecesarias — cada movimiento con intención. Seguir la metodología del coach Matt Chapman: 'Lazy climbing has gravitational consequences.'","rir":"No aplica","recup":"Completa entre bloques","dur":12,"justif":"Entrena la conciencia postural y la eficiencia de movimiento, eliminando hábitos de escalada perezosa que generan pérdida de energía.","video":"https://www.instagram.com/p/DapsnKJAFBs/"},{"bloque":"Principal-Especial","ejercicio":"Escalada libre en terreno desafiante (1' on / 1' off)","objetivo":"Reintroduc ada continua (método continuo)","objetivo":"Capacidad aeróbica del antebrazo","material":"Pared de boulder o muro fácil","series":"-","reps":"15-20 min acumulados","intensidad":"RPE 1-2/5","como":"Escalar sin bajarse de la pared, ritmo cómodo y sostenible","rir":"No aplica (no se busca el fallo)","recup":"Continuo (parte del método)","dur":20,"justif":"Incrementa la densidad mitocondrial y la capilarización del antebrazo."},{"bloque":"Cierre","ejercicio":"Face pull con banda elástica","objetivo":"Deltoides posterior y rotadores externos","material":"Banda elástica","series":"2-3","reps":"12-15","intensidad":"Submáxima","como":"Banda anclada a la altura de la cara, tirar llevando los codos hacia atrás y afuera","rir":"RIR moderado","recup":"30\"","dur":6,"justif":"Compensa el desbalance hombro-anterior típico de escaladores, protege la articulación del hombro."},{"bloque":"Cierre","ejercicio":"Rotadores externos (antagonistas)","objetivo":"Equilibrar musculatura del hombro y prevenir lesiones rotatorias","material":"Banda elástica o mancuerna ligera","series":"2","reps":"12","intensidad":"Baja","como":"Rotación externa con codo a 90° pegado al cuerpo, controlando el movimiento en ambas fases","rir":"RIR 4-6","recup":"60\"","dur":5,"justif":"Compensa el trabajo de tracción y rotación interna de la escalada, protegiendo el manguito rotador."},{"bloque":"Cierre","ejercicio":"Extensores de antebrazo (antagonistas)","objetivo":"Equilibrar la musculatura flexora del antebrazo","material":"Banda elástica o ninguno","series":"2","reps":"12","intensidad":"Baja","como":"Extensión activa de los dedos contra resistencia o con banda, controlando el retorno","rir":"RIR 4-6","recup":"60\"","dur":5,"justif":"Previene desequilibrios flexor/extensor causantes de epicondilitis y lesiones de polea."},{"bloque":"Cierre","ejercicio":"Extensores de muñeca (antagonistas)","objetivo":"Fortalecer extensores y prevenir tendinopatías de muñeca","material":"Mancuerna ligera o banda elástica","se const LOCAL_KEY = 'claseplan_overrides_v1';
let ACTIVE = DATA;
try{
  const saved = localStorage.getItem(LOCAL_KEY);
  if(saved) ACTIVE = JSON.parse(saved);
}catch(err){ console.warn('No se pudo leer cambios guardados localmente', err); }

function persistLocal(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(ACTIVE)); }
  catch(err){ console.warn('No se pudo guardar localmente', err); }
}

function findJsonEnd(text, startIdx){
  let depth = 0, inStr = false, esc = false;
  for(let i = startIdx; i < text.length; i++){
    const c = text[i];
    if(inStr){
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inStr = false;
    } else {
      if(c === '"') inStr = true;
      else if(c === '{') depth++;
      else if(c === '}'){ depth--; if(depth === 0) return i + 1; }
    }
  }
  return -1;
}

function exportUpdatedHtml(){
  const marker = 'const DATA = ';
  const idx = PRISTINE_HTML.indexOf(marker);
  if(idx === -1){ alert('No se pudo generar el archivo (marcador no encontrado).'); return; }
  const jsonStart = idx + marker.length;
  const jsonEnd = findJsonEnd(PRISTINE_HTML, jsonStart);
  if(jsonEnd === -1){ alert('No se pudo generar el archivo (JSON no encontrado).'); return; }
  const newJson = JSON.stringify(ACTIVE, null, 2);
  const newHtml = '<!DOCTYPE html>\n' + PRISTINE_HTML.slice(0, jsonStart) + newJson + PRISTINE_HTML.slice(jsonEnd);
  const blob = new Blob([newHtml], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ClasePlan_GrupoMixto.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetToOriginal(){
  if(!confirm('¿Descartar todos los cambios guardados en este navegador y volver a la versión original del archivo?')) return;
  localStorage.removeItem(LOCAL_KEY);
  location.reload();
}

function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('es-CL', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
}
function fmtDateShort(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('es-CL', {day:'2-digit', month:'short', year:'numeric'});
}

function nearestSessionOnOrAfter(iso){
  for(const d of sortedDates){ if(d >= iso) return d; }
  return sortedDates[sortedDates.length-1];
}
function nearestSessionOnOrBefore(iso){
  let res = sortedDates[0];
  for(const d of sortedDates){ if(d <= iso) res = d; else break; }
  return res;
}

        <li><b>Puente glúteo alternado</b> — 5 reps × 5 seg por pie + 5 seg de mantención final · alternando talones</li>
        <li><b>Apertura de caderas</b> — controlada, sin rebote</li>
        <li><b>World's Best Stretch</b> — versión Antigravity · 3–4 reps por lado</li>
        <li><b>Activación escapular con banda</b> — protracción/retracción + rotación interna/externa combinadas, 8–10 reps</li>
      </ol>
    </div>

    <div class="warmup-phase">
      <div class="warmup-phase-title">Parte B — Activación Específica de Dedos · ~8–9 min</div>
      <p style="font-size:12px;color:var(--ink-dim);margin:0 0 8px 0;">Medir el 100% contra el agarre más duro del día. La ronda 1 se intercala con Kangaroo + Archer Squat; la ronda 2 con activación escapular breve.</p>
      <table class="warmup-table">
        <thead>
          <tr>
            <th>#</th><th>Protocolo dedos</th><th>Intensidad</th><th>Ejercicio intercalado</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>7&quot; on / 3&quot; off</td>
            <td><span class="pct">50%</span></td>
            <td>Kangaroo Squat + Archer Squat</td>
          </tr>
          <tr>
            <td>2</td>
            <td>6&quot; on / 4&quot; off</td>
            <td><span class="pct">70%</span></td>
            <td>Activación Escapular</td>
          </tr>
          <tr>
            <td>3</td>
            <td>3&quot; on</td>
            <td><span class="pct-max">Máximo</span></td>
            <td>—</td>
          </tr>
        </tbody>
      </table>
      <p style="font-size:12px;color:var(--ink-dim);margin:8px 0 0 0;"><b style="color:var(--ink)">Cierre explosivo</b> (justo después de la ronda máxima): 3 dominadas explosivas + 3 flexiones explosivas — activación neuromuscular final antes de escalar.</p>
    </div>
  `;

  head.addEventListener('click', () => div.classList.toggle('collapsed'));
  div.appendChild(head);
  div.appendChild(bcontent);
  return div;
}

function fieldToText(v){ return Array.isArray(v) ? v.join(' / ') : (v===undefined||v===null ? '' : v); }
function textToField(original, text){
  if(Array.isArray(original)) return text.split('/').map(s=>s.trim()).filter(s=>s.length);
  return text;
}
function escAttr(v){ return String(v===undefined||v===null?'':v).replace(/"/g,'&quot;'); }

function renderExercise(e, editMode, onDelete){
  const div = document.createElement('div');

  if(!editMode){
    div.className = 'exercise';
    div.innerHTML = `
      <div class="ename">${e.ejercicio}</div>
      <div class="emeta">${e.objetivo} &middot; ${e.material}</div>
      <div class="grid">
        <div class="g-item"><b>Series</b><span>${fieldToText(e.series)}</span></div>
        <div class="g-item"><b>Repeticiones</b><span>${e.reps}</span></div>
        <div class="g-item"><b>Intensidad</b><span>${fieldToText(e.intensidad)}</span></div>
        <div class="g-item"><b>RIR / RPE</b><span>${e.rir}</span></div>
        <div class="g-item"><b>Recuperación</b><span>${e.recup}</span></div>
        <div class="g-item"><b>Duración</b><span>${e.dur} min</span></div>
      </div>
      <div class="como"><b>Cómo se alcanza: </b>${e.comoSeAlcanza || e.como}</div>
      <div class="justif">${e.justif}</div>
      ${e.video ? (e.video === '#TODO' ? '<span class=\"video-todo\">▶ Video — agregar URL</span>' : '<a class=\"video-link\" href=\"' + e.video + '\" target=\"_blank\">▶ Ver video</a>') : ''}
    `;
    return div;
  }

  div.className = 'exercise-edit';
  const mk = (label, key, type) => {
    const val = fieldToText(e[key]);
    if(type === 'textarea'){
      return `<label class="ef-label">${label}<textarea class="ef-input" data-key="${key}" rows="2">${val}</textarea></label>`;
    }
    return `<label class="ef-label">${label}<input class="ef-input" data-key="${key}" data-type="${type||'text'}" value="${escAttr(val)}"></label>`;
  };
  div.innerHTML = `
    <div class="ef-row">${mk('Ejercicio','ejercicio')}</div>
    <div class="ef-row2">${mk('Objetivo','objetivo')}${mk('Material','material')}</div>
    <div class="ef-row3">${mk('Series','series')}${mk('Reps','reps')}${mk('Intensidad','intensidad')}</div>
    <div class="ef-row3">${mk('RIR / RPE','rir')}${mk('Recuperación','recup')}${mk('Duración (min)','dur','number')}</div>
    <div class="ef-row">${mk('Cómo se alcanza','como','textarea')}</div>
    <div class="ef-row">${mk('Justificación','justif','textarea')}</div>
    <div class="ef-row">${mk('Video (URL)','video')}</div>
    <button type="button" class="ef-del">🗑 Eliminar ejercicio</button>
  `;
  div.querySelectorAll('.ef-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.key;
      const type = inp.dataset.type;
      let val = inp.value;
      if(type === 'number') val = val === '' ? 0 : Number(val);
      else val = textToField(e[key], val);
      e[key] = val;
      persistLocal();
    });
  });
  div.querySelector('.ef-del').addEventListener('click', () => {
    if(confirm('¿Eliminar este ejercicio?')) onDelete();
  });
  return div;
}

function renderSession(iso){
  mesoBadge.innerHTML = '';
  sessionContent.innerHTML = '';
  const s = byDate[iso];

  if(!s){
    const next = nearestSessionOnOrAfter(iso);
    const prev = nearestSessionOnOrBefore(iso);
    const target = next || prev;
    sessionContent.innerHTML = `
      <div class="empty">
        <p>No hay clase programada este día.<br>Próxima sesión: <b>${fmtDate(target)}</b></p>
        <button onclick="goTo('${target}')">Ver esa sesión</button>
      </div>`;
    return;
  }

  mesoBadge.innerHTML = `
    <div class="meso-badge">
      <div class="tag">${s.mesociclo}</div>
      <div class="info">
        <b>${s.mesocicloNombre}</b>
        <span>${s.mesocicloObjetivo}</span>
      </div>
    </div>`;

  const order = ["Calentamiento","Calentamiento-Muro","Principal-Dirigido","Principal-Especial","Pre-Cierre","Cierre"];
  const dateHeader = document.createElement('div');
  dateHeader.style.cssText = "font-weight:700;font-size:15px;margin-bottom:12px;text-transform:capitalize;";
  dateHeader.textContent = fmtDate(iso);
  sessionContent.appendChild(dateHeader);

  order.forEach(bloque => {
    const items = s.ejercicios.filter(e => e.bloque === bloque);
    if(items.length === 0 && !editMode) return;
    const blockDiv = document.createElement('div');
    blockDiv.className = 'block ' + bloque + (editMode ? '' : ' collapsed');
    const head = document.createElement('div');
    head.className = 'bhead';
    head.innerHTML = bloque.replace('-', ' · ') + '<span class="toggle-icon">▾</span>';
    const bcontent = document.createElement('div');
    bcontent.className = 'bcontent';
    items.forEach(e => bcontent.appendChild(renderExercise(e, editMode, () => {
      const idx = s.ejercicios.indexOf(e);
      if(idx !== -1) s.ejercicios.splice(idx, 1);
      persistLocal();
      renderSession(iso);
    })));
    if(editMode){
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'ef-add';
      addBtn.textContent = '+ Añadir ejercicio a ' + bloque.replace('-', ' · ');
      addBtn.addEventListener('click', () => {
        s.ejercicios.push({
          bloque: bloque, ejercicio: 'Nuevo ejercicio', objetivo: '', material: '',
          series: '', reps: '', intensidad: '', como: '', rir: '', recup: '', dur: 0, justif: ''
        });
        persistLocal();
        renderSession(iso);
      });
      bcontent.appendChild(addBtn);
    }
    blockDiv.appendChild(head);
    blockDiv.appendChild(bcontent);
    head.addEventListener('click', () => blockDiv.classList.toggle('collapsed'));
    sessionContent.appendChild(blockDiv);
    if(bloque === 'Calentamiento') sessionContent.appendChild(renderWarmupGeneral());
  });
}

function goTo(iso){
  dateInput.value = iso;
  renderSession(iso);
}

dateInput.min = minDate;
dateInput.max = maxDate;

dateInput.addEventListener('change', () => renderSession(dateInput.value));

document.getElementById('prevBtn').addEventListener('click', () => {
  const cur = dateInput.value || minDate;
  const idx = sortedDates.indexOf(cur);
  let target;
  if(idx > 0) target = sortedDates[idx-1];
  else target = nearestSessionOnOrBefore(cur) !== cur ? nearestSessionOnOrBefore(cur) : sortedDates[Math.max(0, sortedDates.findIndex(d=>d>=cur)-1)];
  if(!target) target = sortedDates[0];
  goTo(target);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const cur = dateInput.value || minDate;
  const idx = sortedDates.indexOf(cur);
  let target;
  if(idx >= 0 && idx < sortedDates.length-1) target = sortedDates[idx+1];
  else target = nearestSessionOnOrAfter(cur);
  if(!target) target = sortedDates[sortedDates.length-1];
  goTo(target);
});

// Tabs
const tabSesion = document.getElementById('tabSesion');
const tabMacro = document.getElementById('tabMacro');
const viewSesion = document.getElementById('viewSesion');
const viewMacro = document.getElementById('viewMacro');
tabSesion.addEventListener('click', () => {
  tabSesion.classList.add('active'); tabMacro.classList.remove('active');
  viewSesion.style.display='block'; viewMacro.style.display='none';
});
tabMacro.addEventListener('click', () => {
  tabMacro.classList.add('active'); tabSesion.classList.remove('active');
  viewMacro.style.display='block'; viewSesion.style.display='none';
});

// Modo edición
let editMode = false;
const editToggle = document.getElementById('editToggle');
const editActions = document.getElementById('editActions');
const editHint = document.getElementById('editHint');
editToggle.addEventListener('click', () => {
  editMode = !editMode;
  editToggle.classList.toggle('on', editMode);
  editToggle.textContent = editMode ? '✓ Editando' : '✏️ Editar';
  editActions.style.display = editMode ? 'flex' : 'none';
  editHint.style.display = editMode ? 'block' : 'none';
  renderSession(dateInput.value || minDate);
});
document.getElementById('exportBtn').addEventListener('click', exportUpdatedHtml);
document.getElementById('resetBtn').addEventListener('click', resetToOriginal);

// Macrociclo (vista calendario) — agrupa las sesiones por semana calendario (lunes-domingo)
// y luego agrupa las semanas consecutivas por mesociclo, para mostrar el avance semana a semana.
const mesoColors = {
  M0: 'rgba(46,173,130,1)',    // teal 100%
  M1: 'rgba(201,124,42,1)',    // orange 100%
  M2: 'rgba(58,143,181,1)',    // blue 100%
  M3: 'rgba(46,173,130,0.62)', // teal 62%
  M4: 'rgba(201,124,42,0.62)', // orange 62%
  M5: 'rgba(58,143,181,0.62)', // blue 62%
  M6: 'rgba(46,173,130,0.32)', // teal 32% — tapering, intensidad "apagándose"
};
function mesoColorOf(id){ return mesoColors[id] || 'var(--accent)'; }

function weekStartIso(iso){
  const d = new Date(iso+"T00:00:00");
  const dow = (d.getDay() + 6) % 7; // lunes = 0
  d.setDate(d.getDate() - dow);
  return d.toISOString().slice(0,10);
}
function addDaysIso(iso, days){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function fmtDayShort(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('es-CL', {day:'2-digit', month:'short'}).replace('.', '');
}

const weekMap = new Map();
sessions.forEach(s => {
  const wk = weekStartIso(s.fecha);
  if(!weekMap.has(wk)) weekMap.set(wk, []);
  weekMap.get(wk).push(s);
});
const weeks = [...weekMap.keys()].sort().map((wkStart, i) => {
  const wkSessions = weekMap.get(wkStart).sort((a,b) => a.fecha.localeCompare(b.fecha));
  return {
    num: i + 1,
    start: wkStart,
    end: addDaysIso(wkStart, 6),
    mesociclo: wkSessions[0].mesociclo,
    sessions: wkSessions,
  };
});

// Legend
const mesoLegend = document.getElementById('mesoLegend');
mesociclos.forEach(m => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = `<span class="dot" style="background:${mesoColorOf(m.id)}"></span>${m.id}`;
  mesoLegend.appendChild(chip);
});

// Week strip (Gantt de una fila, 1 segmento por semana)
const weekStrip = document.getElementById('weekStrip');
weeks.forEach(w => {
  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.style.background = mesoColorOf(w.mesociclo);
  seg.title = `Semana ${w.num} · ${w.mesociclo} · ${fmtDateShort(w.start)} – ${fmtDateShort(w.end)}`;
  seg.addEventListener('click', () => { goTo(w.sessions[0].fecha); tabSesion.click(); });
  weekStrip.appendChild(seg);
});

// Lista agrupada por mesociclo, con el detalle semana a semana dentro de cada uno
const calendarList = document.getElementById('calendarList');
let curGroup = null, curMeso = null;
weeks.forEach(w => {
  const m = mesociclos.find(x => x.id === w.mesociclo);
  if(w.mesociclo !== curMeso){
    curMeso = w.mesociclo;
    curGroup = document.createElement('div');
    curGroup.className = 'meso-group';
    const head = document.createElement('div');
    head.className = 'meso-group-head';
    head.style.borderLeftColor = mesoColorOf(m.id);
    head.innerHTML = `
      <div class="mid">${m.id} · ${m.semanas} semana${m.semanas>1?'s':''}</div>
      <div class="mname">${m.nombre}</div>
      <div class="mgoal">${m.objetivo}</div>
      <div class="mtrend">${m.tendencia}</div>
    `;
    curGroup.appendChild(head);
    calendarList.appendChild(curGroup);
  }
  const row = document.createElement('div');
  row.className = 'week-row';
  row.style.borderLeftColor = mesoColorOf(m.id);
  const chips = w.sessions.map(s => `
    <div class="wk-chip" data-fecha="${s.fecha}">
      <span class="d">${fmtDayShort(s.fecha)}</span><span class="m">${s.diaSemana.slice(0,3)}</span>
    </div>`).join('');
  row.innerHTML = `<div class="wk-num">Semana ${w.num}</div><div class="wk-dates">${chips}</div>`;
  row.querySelectorAll('.wk-chip').forEach(chip => {
    chip.addEventListener('click', () => { goTo(chip.dataset.fecha); tabSesion.click(); });
  });
  curGroup.appendChild(row);
});

// Init: show first upcoming session from today, or first session if program hasn't started
const todayIso = new Date().toISOString().slice(0,10);
const initTarget = nearestSessionOnOrAfter(todayIso < minDate ? minDate : todayIso);
goTo(initTarget);
</script>
